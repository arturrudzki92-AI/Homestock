<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#145c48"><link rel="manifest" href="manifest.json"><title>HomeStock</title><style> *{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17382e;font:16px system-ui}main{max-width:650px;margin:auto;padding:18px 16px 95px}header{background:#145c48;color:white;padding:22px;border-radius:20px}h1,h2,p{margin:0 0 12px}small{color:#526b61}button,input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #ccd9d2}button{cursor:pointer;background:#fff;color:#17382e}button.primary{background:#16734f;color:white;border:0}button.out{background:#a43d36;color:white;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.tile,article{background:white;border:1px solid #dce5df;border-radius:16px;padding:15px;margin-bottom:10px}.tile strong{display:block;font-size:28px}.line{display:flex;align-items:center;gap:8px}.line>div:first-child{flex:1;min-width:0;overflow-wrap:anywhere}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;box-shadow:0 -2px 10px #0001;padding:8px 4px env(safe-area-inset-bottom)}nav button{border:0;padding:12px 8px;flex:1;max-width:160px}nav button.active{color:#16734f;font-weight:bold;background:#e5f2e9}input{width:100%;margin:5px 0 12px}dialog{width:min(94%,470px);border:0;border-radius:20px;padding:20px;color:inherit}dialog::backdrop{background:#0008}video{width:100%;max-height:260px;background:#111;border-radius:12px}#notice{min-height:24px;color:#145c48}label{display:block;font-size:14px} .danger{color:#a43d36}</style></head><body><main><header><small style="color:#d1e9dd">DOMOWY MAGAZYN · v0.1.2</small><h1>HomeStock</h1><div>Twoje zapasy pod kontrolą</div></header><div id="notice" role="status"></div><section id="view"></section></main><nav id="nav"></nav><dialog id="dlg"><h2 id="modeTitle"></h2><div id="camera" hidden><video id="video" playsinline muted></video><p><small>Skieruj aparat na kod produktu.</small></p></div><button id="camBtn">📷 Uruchom aparat</button><form id="lookup"><label>Kod kreskowy<input id="code" required inputmode="numeric" autocomplete="off" placeholder="EAN lub własny kod"></label><button class="primary">Rozpoznaj produkt</button></form><p id="lookupStatus" role="status"></p><form id="movement" hidden><label>Nazwa produktu<input id="name" required></label><label>Ilość opakowań<input id="qty" type="number" min="1" max="99999" step="1" value="1" required></label><label>Stan minimalny<input id="minimum" type="number" min="0" max="99999" step="1" value="1" required></label><button class="primary" id="save">Zapisz</button></form><button id="close" style="margin-top:12px">Anuluj</button></dialog><script>
const $=id=>document.getElementById(id);let db={products:{},history:[]};try{db=JSON.parse(localStorage.getItem('homestock-v1'))||db}catch{}let tab='Start',mode=1,stream=null,scanner=null,scanToken=0,lookupToken=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(next){try{localStorage.setItem('homestock-v1',JSON.stringify(next));db=next;return true}catch{alert('Nie udało się zapisać danych.');return false}}function msg(s){$('notice').textContent=s}function items(){return Object.entries(db.products).sort((a,b)=>a[1].name.localeCompare(b[1].name,'pl'))}function row([k,p]){return `<article class="line"><div><b>${esc(p.name)}</b><br><small>${esc(k)} · min. ${p.min}</small></div><strong class="${p.stock<p.min?'danger':''}">${p.stock} szt.</strong><button data-code="${esc(k)}" data-mode="-1" aria-label="Zużyj">−</button><button data-code="${esc(k)}" data-mode="1" aria-label="Przyjmij">+</button></article>`}function render(){let a=items(),low=a.filter(([k,p])=>p.stock<p.min);$('nav').innerHTML=['Start','Magazyn','Zakupy','Historia','Dane'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');$('view').innerHTML=tab==='Start'?`<div class="grid"><div class="tile"><small>Produkty na stanie</small><strong>${a.filter(([k,p])=>p.stock>0).length}</strong></div><div class="tile"><small>Opakowania</small><strong>${a.reduce((s,[k,p])=>s+p.stock,0)}</strong></div><div class="tile"><small>Do uzupełnienia</small><strong>${low.length}</strong></div><div class="tile"><small>Operacje</small><strong>${db.history.length}</strong></div></div><div class="grid"><button class="primary" data-mode="1">📷 + Przyjęcie</button><button class="out" data-mode="-1">📷 − Zużycie</button></div><h2>Ostatnie zapasy</h2>${a.slice(0,5).map(row).join('')||'<p>Dodaj pierwszy produkt.</p>'}`:tab==='Magazyn'?`<h2>Magazyn</h2><input id="search" placeholder="Szukaj produktu lub kodu"><div id="results">${a.map(row).join('')||'Brak produktów'}</div>`:tab==='Zakupy'?`<h2>Lista zakupów</h2>${low.map(([k,p])=>`<article>${esc(p.name)} <b>· ${p.min-p.stock} szt.</b></article>`).join('')||'Wszystkie zapasy uzupełnione.'}`:tab==='Historia'?`<h2>Historia operacji</h2>${db.history.slice().reverse().map(h=>`<article><b>${esc(h.name)} · ${h.delta>0?'+':''}${h.delta}</b><br><small>${esc(new Date(h.date).toLocaleString('pl-PL'))} · stan: ${h.stock}</small></article>`).join('')||'Brak operacji'}`:`<h2>Kopia zapasowa</h2><p>Dane są przechowywane tylko na tym urządzeniu. Regularnie eksportuj kopię.</p><button id="export">Eksport JSON</button><label>Przywróć kopię (zastąpi dane)<input id="import" type="file" accept="application/json,.json"></label>`;if($('search'))$('search').oninput=e=>$('results').innerHTML=a.filter(([k,p])=>(k+' '+p.name).toLowerCase().includes(e.target.value.toLowerCase())).map(row).join('');if($('export'))$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='homestock-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};if($('import'))$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.products||typeof d.products!=='object'||Array.isArray(d.products)||!Array.isArray(d.history)||!Object.values(d.products).every(p=>typeof p.name==='string'&&Number.isSafeInteger(p.stock)&&p.stock>=0&&Number.isSafeInteger(p.min)&&p.min>=0)||!d.history.every(h=>typeof h.name==='string'&&Number.isSafeInteger(h.delta)&&Number.isSafeInteger(h.stock)&&!isNaN(Date.parse(h.date))))throw Error();if(confirm('Zastąpić obecne dane?')&&persist(d))render()}catch{alert('Nieprawidłowa kopia.')}}}function stop(){scanToken++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('camera').hidden=true;if(scanner){try{scanner.reset()}catch{}scanner=null}}function openMove(m,k=''){mode=m;$('modeTitle').textContent=m===1?'Przyjęcie produktu':'Zużycie produktu';$('code').value=k;$('qty').value=1;$('movement').hidden=true;$('lookupStatus').textContent='';$('dlg').showModal();if(k)lookup()}async function lookup(){stop();let k=$('code').value.trim();if(!k)return;let token=++lookupToken;$('movement').hidden=true;let p=Object.hasOwn(db.products,k)?db.products[k]:null;let source=p?'Kartoteka lokalna':'';let outcomes=[];$('lookupStatus').textContent='';if(!p&&mode===-1){$('lookupStatus').textContent='Brak produktu w magazynie.';return}if(!p){$('lookupStatus').textContent='Szukam w bazach produktów…';let bases=[['Open Food Facts','world.openfoodfacts.org'],['Open Beauty Facts','world.openbeautyfacts.org'],['Open Products Facts','world.openproductsfacts.org']];let codes=[k];if(/^0\d{12}$/.test(k))codes.push(k.slice(1));else if(/^\d{12}$/.test(k))codes.push('0'+k);let results=await Promise.all(bases.map(async ([label,host])=>{for(let code of codes){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),6500);try{let r=await fetch('https://'+host+'/api/v2/product/'+encodeURIComponent(code)+'?fields=code,product_name,product_name_pl,product_name_en,generic_name,brands,quantity',{signal:controller.signal});if(r.status===404)continue;if(!r.ok)return {label,error:'HTTP '+r.status};let d=await r.json(),v=d.product||{};let name=[v.product_name_pl,v.product_name,v.product_name_en,v.generic_name].find(x=>typeof x==='string'&&x.trim());if(name)return {label,p:{name:[name.trim(),v.quantity].filter(Boolean).join(' · '),min:1,stock:0}};if(d.status!==0&&d.status!==1)return {label,error:'nieoczekiwana odpowiedź'}}catch(e){return {label,error:e.name==='AbortError'?'limit czasu':'brak połączenia'}}finally{clearTimeout(timer)}}return {label,error:'brak produktu'}}));if(token!==lookupToken||!$('dlg').open)return;let found=results.find(x=>x.p);if(found){p=found.p;source=found.label}outcomes=results.map(x=>x.label+': '+(x.p?'znaleziono':x.error))}if(token!==lookupToken||!$('dlg').open)return;$('name').value=p?.name||'';$('minimum').value=p?.min??1;$('lookupStatus').textContent=p?source+' · Stan przed operacją: '+p.stock+' szt.':'Nie rozpoznano kodu '+k+'. '+outcomes.join(' | ')+'. Wpisz nazwę ręcznie.';$('movement').hidden=false;$('save').disabled=false} $('lookup').onsubmit=e=>{e.preventDefault();lookup()};$('code').oninput=()=>{lookupToken++;$('movement').hidden=true};$('movement').onsubmit=e=>{e.preventDefault();let k=$('code').value.trim(),name=$('name').value.trim(),q=Number($('qty').value),min=Number($('minimum').value),old=Object.hasOwn(db.products,k)?db.products[k]:null,stock=(old?.stock||0)+mode*q;if(!name||stock<0){$('lookupStatus').textContent='Nieprawidłowa nazwa lub niewystarczający stan.';return}let next=structuredClone(db);Object.defineProperty(next.products,k,{value:{name,min,stock},enumerable:true,writable:true,configurable:true});next.history.push({code:k,name,delta:mode*q,stock,date:new Date().toISOString()});if(persist(next)){$('dlg').close();render();msg(`${name}: ${stock} szt.`)}};$('close').onclick=()=>$('dlg').close();$('dlg').onclose=()=>{lookupToken++;stop()};document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.mode)openMove(Number(b.dataset.mode),b.dataset.code)});function scanProductCode(raw,format){let v=String(raw||'').trim();if(/^(https?:\/\/|www\.)/i.test(v)){ $('lookupStatus').textContent='Pominięto kod strony internetowej. Skieruj aparat na kod kreskowy EAN.';return null}if(/^\d{8}$|^\d{12,14}$/.test(v))return v;let gs=v.match(/^(?:\]d2)?(?:\(01\)|01)(\d{14})(?:\D|\d|$)/);if(gs)return gs[1].startsWith('0')?gs[1].slice(1):gs[1];$('lookupStatus').textContent='Pominięto kod niebędący identyfikatorem produktu. Szukam EAN/UPC…';return null} $('camBtn').onclick=async()=>{stop();let token=scanToken;try{if('BarcodeDetector'in window){let formats=await BarcodeDetector.getSupportedFormats();let f=['ean_13','ean_8','upc_a','upc_e','code_128','qr_code','data_matrix'].filter(x=>formats.includes(x));if(f.includes('ean_13')){let detector=new BarcodeDetector({formats:f});let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});if(token!==scanToken){s.getTracks().forEach(t=>t.stop());return}stream=s;$('camera').hidden=false;$('video').srcObject=stream;await $('video').play();let tick=async()=>{if(token!==scanToken)return;try{let a=await detector.detect($('video'));if(token!==scanToken)return;if(a.length){a.sort((x,y)=>Number(/^(ean_|upc_)/.test(y.format))-Number(/^(ean_|upc_)/.test(x.format)));for(let b of a){let code=scanProductCode(b.rawValue,b.format);if(code){$('code').value=code;lookup();return}}}}catch{}setTimeout(tick,180)};tick();return}}await new Promise((resolve,reject)=>{if(window.ZXing)return resolve();let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=resolve;s.onerror=reject;document.head.append(s)});if(token!==scanToken)return;let hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.DATA_MATRIX]);scanner=new ZXing.BrowserMultiFormatReader(hints);$('camera').hidden=false;scanner.decodeFromVideoDevice(undefined,'video',(r)=>{if(r&&token===scanToken){let code=scanProductCode(r.getText(),r.getBarcodeFormat());if(code){$('code').value=code;lookup()}}}).catch(()=>{$('lookupStatus').textContent='Nie udało się uruchomić aparatu. Wpisz kod ręcznie.';stop()})}catch{$('lookupStatus').textContent='Aparat niedostępny. Sprawdź uprawnienia i HTTPS lub wpisz kod ręcznie.';stop()}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
